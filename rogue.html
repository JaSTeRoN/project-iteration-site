<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Подземелье Rogue — Итерация-8</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
  <link rel="stylesheet" href="assets/css/demo.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><img src="assets/brand/logo.png" alt="Итерация-8"></a>
    <nav class="site-nav" aria-label="Разделы">
      <a href="schedule.html">Расписание</a>
      <a href="projects.html">Проекты и команды</a>
      <a href="materials.html">Материалы</a>
      <a href="apps.html" aria-current="page">Приложения</a>
    </nav>
  </header>
<main class="demo">
  <h1 class="page-title">Подземелье Rogue, 1980</h1>
  <p class="explain">Уровень Rogue собирается по шагам: секторы, комнаты, связное дерево коридоров, двери и только потом вещи. После ролика символом @ можно пройтись по полу.</p>
  <div class="transport" id="transport">
    <button type="button" id="to-start">В начало</button>
    <button type="button" id="step-back">Шаг назад</button>
    <button type="button" id="play">Пуск</button>
    <button type="button" id="step-forward">Шаг вперёд</button>
    <button type="button" id="to-end">В конец</button>
    <label class="field">Скорость
      <input id="speed" type="range" min="4" max="120" value="28">
    </label>
    <p class="caption" id="caption" role="status"></p>
    <p class="message" id="message" role="status"></p>
  </div>
  <div class="layout">
    <section class="stage iso-mode" id="stage">
      <canvas id="map" aria-label="Карта подземелья"></canvas>
      <div class="zoom-controls">
        <button type="button" id="zoom-out" aria-label="Уменьшить">−</button>
        <button type="button" id="zoom-in" aria-label="Увеличить">+</button>
      </div>
    </section>
    <aside class="side" id="side"></aside>
  </div>
  <div class="dpad-wrap">
    <div class="dpad" aria-label="Ход по подземелью">
      <button type="button" data-dir="n" aria-label="Вверх">↑</button>
      <button type="button" data-dir="w" aria-label="Влево">←</button>
      <button type="button" data-dir="e" aria-label="Вправо">→</button>
      <button type="button" data-dir="s" aria-label="Вниз">↓</button>
    </div>
  </div>
</main>
<script type="module" src="assets/js/rogue/app.js"></script>
</body>
</html>
