<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Материалы — Итерация-8</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
  <link rel="stylesheet" href="assets/css/content.css">
</head>
<body class="crystal">
  <header class="site-header">
    <a class="brand" href="index.html"><img src="assets/brand/logo.webp" alt="Итерация-8"><span class="brand-home">| Главная</span></a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Открыть разделы">
      <span class="nav-toggle-title">Материалы</span>
      <span class="nav-toggle-bars" aria-hidden="true"><span></span><span></span><span></span></span>
    </button>
    <nav class="site-nav" id="site-nav" aria-label="Разделы">
      <a href="schedule.html">Расписание</a>
      <a href="projects.html">Проекты и команды</a>
      <a href="materials.html" aria-current="page">Материалы</a>
      <a href="apps.html">Приложения</a>
      <a href="about.html">О курсе</a>
    </nav>
  </header>
  <main class="wrap">
    <div class="page-lead with-mascot">
      <img class="lead-mascot" src="assets/brand/voxel/reading_book.webp" alt="" aria-hidden="true">
      <div>
        <h1>Учебные материалы</h1>
        <p>Материалы, которые помогут тебе в освоении курса.</p>
      </div>
    </div>
    <section class="section-grid content-grid" id="materials" aria-live="polite"></section>
  </main>
  <footer class="site-footer">
    <p class="wrap">Специ<a class="admin-dot" href="admin.html" aria-label="Админка" style="text-decoration:none">а</a>льный курс «Итерация-8». <a class="footer-link" href="https://gpo.tusur.ru/chairs/9/projects/1637" target="_blank" rel="noopener noreferrer">Проект ГПО ЭМИС-2003 «Процедурная генерация игрового контента»</a>, <a class="footer-link" href="https://tusur.ru" target="_blank" rel="noopener noreferrer">ТУСУР</a>, <a class="footer-link" href="about.html">О курсе</a>, <span data-year>2026</span>.</p>
  </footer>
  <script type="module">
    const host = document.querySelector("#materials")

    function safeUrl(value) {
      try {
        const url = new URL(value)
        if (url.protocol === "https:" || url.protocol === "http:") return url.href
      } catch {
        return ""
      }
      return ""
    }

    function card(material) {
      const article = document.createElement("article")
      article.className = "card"
      if (material.date) {
        const date = document.createElement("p")
        date.className = "card-meta"
        date.textContent = new Intl.DateTimeFormat("ru-RU", {
          day: "numeric",
          month: "long",
          year: "numeric",
          timeZone: "UTC",
        }).format(new Date(`${material.date}T12:00:00Z`))
        article.append(date)
      }
      const title = document.createElement("h2")
      title.textContent = material.title || "Материал"
      article.append(title)
      if (material.note) {
        const note = document.createElement("p")
        note.textContent = material.note
        article.append(note)
      }
      const href = safeUrl(material.url)
      if (href) {
        const link = document.createElement("a")
        link.className = "card-link"
        link.href = href
        link.target = "_blank"
        link.rel = "noopener noreferrer"
        link.textContent = material.kind === "file" ? "Скачать" : "Открыть"
        article.append(link)
      }
      return article
    }

    try {
      const response = await fetch("data/materials.json", { cache: "no-cache" })
      const payload = response.ok ? await response.json() : { materials: [] }
      const materials = Array.isArray(payload.materials) ? payload.materials : []
      if (materials.length === 0) {
        const empty = document.createElement("article")
        empty.className = "panel-card empty-card"
        empty.textContent = "Пока ни одного материала — карточки появятся здесь, как только их добавят."
        host.append(empty)
      } else {
        for (const material of materials) host.append(card(material))
      }
    } catch {
      host.textContent = "Не удалось загрузить материалы."
    }
  </script>
  <script src="assets/js/nav.js" defer></script>
  <script src="assets/js/footer.js" defer></script>
</body>
</html>
