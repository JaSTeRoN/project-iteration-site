<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Плитки Вана — Итерация-8</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
  <link rel="stylesheet" href="assets/css/demo.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><img src="assets/brand/logo.webp" alt="Итерация-8"><span class="brand-home">| Главная</span></a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Открыть разделы">
      <span class="nav-toggle-title">Приложения</span>
      <span class="nav-toggle-bars" aria-hidden="true"><span></span><span></span><span></span></span>
    </button>
    <nav class="site-nav" id="site-nav" aria-label="Разделы">
      <a href="schedule.html">Расписание</a>
      <a href="projects.html">Проекты и команды</a>
      <a href="materials.html">Материалы</a>
      <a href="apps.html" aria-current="page">Приложения</a>
    </nav>
  </header>
<main class="demo">
  <h1 class="page-title">Плитки Вана</h1>
  <div class="level-tabs" role="tablist">
    <button type="button" data-level="1" aria-selected="true">1. Правило</button>
    <button type="button" data-level="2">2. Дороги</button>
    <button type="button" data-level="3">3. Трава</button>
    <button type="button" data-level="4">4. Песочница</button>
  </div>
  <p class="explain" id="explain"></p>
  <p class="message" id="message" role="status"></p>
  <div class="transport hidden" id="transport">
    <button type="button" id="to-start">В начало</button>
    <button type="button" id="step-back">Шаг назад</button>
    <button type="button" id="play">Пуск</button>
    <button type="button" id="step-forward">Шаг вперёд</button>
    <button type="button" id="to-end">В конец</button>
    <label class="field">Скорость
      <input id="speed" type="range" min="1" max="40" value="14">
    </label>
  </div>
  <div class="layout">
    <section class="stage flat-mode" id="stage">
      <div class="flat" id="flat"><div class="board" id="board"></div></div>
      <canvas id="iso" class="hidden" aria-label="Изометрическая карта плиток Вана"></canvas>
      <div class="zoom-controls hidden" id="zoom-controls">
        <button type="button" id="zoom-out" aria-label="Уменьшить">−</button>
        <button type="button" id="zoom-in" aria-label="Увеличить">+</button>
      </div>
    </section>
    <aside class="side" id="side"></aside>
  </div>
  <div class="tray" id="tray" aria-label="Плитки"></div>
  <p class="detail" id="detail"></p>
</main>
<script type="module">
  import { guardPage } from "./assets/js/access.js"
  if (await guardPage("wang.html")) await import("./assets/js/wang/app.js")
</script>
  <script src="assets/js/nav.js" defer></script>
</body>
</html>
